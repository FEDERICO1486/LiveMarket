<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accedi o registrati | LiveMarket</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f8f8;color:#25363a;font:16px system-ui,Arial,sans-serif}header{background:white;padding:20px max(20px,calc((100% - 1100px)/2))}a{color:#087f78;text-decoration:none}.brand{font-size:28px;font-weight:800}.wrap{max-width:460px;margin:45px auto;padding:0 15px}.card{background:white;border:1px solid #dce7e6;border-radius:16px;padding:30px;box-shadow:0 12px 28px #0b575510}h1{font-size:26px;margin:0 0 8px}p{color:#617579}label{display:block;margin:14px 0 5px}input{width:100%;border:1px solid #cbd6d6;border-radius:8px;padding:13px;font:inherit}button{width:100%;border:1px solid #087f78;border-radius:8px;padding:12px;margin-top:14px;background:#087f78;color:white;font:inherit;font-weight:700;cursor:pointer}.google{background:white;color:#26363a;border-color:#cad5d5}.links{display:flex;justify-content:space-between;gap:8px;margin-top:18px;flex-wrap:wrap}.links button{width:auto;background:transparent;border:0;color:#087f78;padding:0;margin:0;font-size:14px}.hidden{display:none}#status{min-height:20px}#setup{background:#fff5e8;border-radius:8px;padding:12px;font-size:14px}</style></head><body>
<header><a class="brand" href="index.html">LiveMarket</a></header><main class="wrap"><section class="card"><h1 id="heading">Accedi a LiveMarket</h1><p>Usa email e password oppure il tuo account Google.</p><div id="setup" class="hidden">Per attivare gli accessi, configura <strong>firebase-config.js</strong> e abilita i metodi di accesso su Firebase.</div><form id="form"><div id="namebox" class="hidden"><label for="name">Nome pubblico</label><input id="name" maxlength="60" autocomplete="nickname"></div><label for="email">Email</label><input id="email" type="email" required autocomplete="email"><label for="password">Password</label><input id="password" type="password" minlength="6" required autocomplete="current-password"><button id="submit" type="submit">Accedi</button></form><button class="google" id="google" type="button">Continua con Google</button><div class="links"><button id="toggle" type="button">Crea nuovo account</button><button id="reset" type="button">Password dimenticata?</button></div><p id="status" role="status"></p><p><a href="index.html">← Torna al sito</a></p></section></main>
<script type="module">
import {configured,watchUser,emailLogin,register,googleLogin,redirectResult,resetPassword,friendlyError} from './auth.js';
const $=id=>document.getElementById(id);let mode='login';const next=new URLSearchParams(location.search).get('next');const destination=next==='vendi'?'vendi.html':'index.html';
if(!configured){$('setup').classList.remove('hidden');$('submit').disabled=true;$('google').disabled=true}
function setMode(value){mode=value;$('heading').textContent=mode==='register'?'Crea il tuo account':'Accedi a LiveMarket';$('submit').textContent=mode==='register'?'Crea account':'Accedi';$('toggle').textContent=mode==='register'?'Hai già un account? Accedi':'Crea nuovo account';$('namebox').classList.toggle('hidden',mode!=='register');$('password').autocomplete=mode==='register'?'new-password':'current-password';$('status').textContent=''}
$('toggle').onclick=()=>setMode(mode==='login'?'register':'login');
$('form').onsubmit=async e=>{e.preventDefault();$('status').textContent='Attendi...';try{if(mode==='register')await register($('email').value,$('password').value,$('name').value);else await emailLogin($('email').value,$('password').value);location.href=destination}catch(err){$('status').textContent=friendlyError(err)}};
$('google').onclick=async()=>{try{$('status').textContent='Accesso Google in corso...';await googleLogin();location.href=destination}catch(err){$('status').textContent=friendlyError(err)}};
$('reset').onclick=async()=>{const email=$('email').value.trim();if(!email){$('status').textContent='Inserisci prima la tua email.';return}try{await resetPassword(email);$('status').textContent='Se l’indirizzo è registrato, riceverai un messaggio per reimpostare la password.'}catch(err){$('status').textContent=friendlyError(err)}};
redirectResult().catch(e=>$('status').textContent=friendlyError(e));watchUser(user=>{if(user)location.replace(destination)});
</script></body></html>
