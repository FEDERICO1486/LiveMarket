<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accedi | LiveMarket</title><link rel="stylesheet" href="style.css"></head><body><main class="auth-wrap"><section class="panel auth-card"><h1 id="heading">Accedi a LiveMarket</h1><p class="muted" id="intro">Usa email e password oppure il tuo account Google.</p><form id="form"><label id="nameField" class="field hidden">Nome pubblico<input id="name" autocomplete="name" maxlength="60"></label><label class="field">Email<input id="email" type="email" autocomplete="email" required></label><label id="passwordField" class="field">Password<input id="password" type="password" autocomplete="current-password" minlength="6" required></label><button id="submit" class="primary wide" type="submit">Accedi</button></form><button type="button" id="google" class="wide">Continua con Google</button><div class="auth-links"><button type="button" class="link-btn" id="register">Crea nuovo account</button><button type="button" class="link-btn" id="forgot">Password dimenticata?</button></div><p id="message" role="status" class="muted"></p><a href="index.html">← Torna al sito</a></section></main><script type="module">
import { watchUser, loginEmail, registerEmail, resetPassword, loginGoogle, friendlyError } from './auth.js?v=20261110b';
const $=id=>document.getElementById(id);let mode='login',busy=false;
const next=new URLSearchParams(location.search).get('next');const destination=next==='vendi'?'vendi.html':'index.html';
function setMode(value){mode=value;$('message').textContent='';$('heading').textContent=mode==='register'?'Crea nuovo account':mode==='reset'?'Recupera password':'Accedi a LiveMarket';$('intro').textContent=mode==='reset'?'Ti invieremo un link per reimpostare la password.':'Usa email e password oppure il tuo account Google.';$('nameField').classList.toggle('hidden',mode!=='register');$('passwordField').classList.toggle('hidden',mode==='reset');$('password').required=mode!=='reset';$('name').required=mode==='register';$('google').classList.toggle('hidden',mode==='reset');$('submit').textContent=mode==='register'?'Crea account':mode==='reset'?'Invia email di recupero':'Accedi';$('register').textContent=mode==='login'?'Crea nuovo account':'Torna all’accesso';$('forgot').classList.toggle('hidden',mode==='reset');}
$('register').onclick=()=>setMode(mode==='login'?'register':'login');$('forgot').onclick=()=>setMode('reset');
async function run(action){if(busy)return;busy=true;$('submit').disabled=true;$('google').disabled=true;$('message').textContent='Attendi...';try{await action();if(mode==='reset')$('message').textContent='Se l’indirizzo e associato a un account email/password, riceverai un messaggio di recupero. Controlla anche lo spam.';else location.href=destination;}catch(e){$('message').textContent=friendlyError(e);}finally{busy=false;$('submit').disabled=false;$('google').disabled=false;}}
$('form').onsubmit=e=>{e.preventDefault();const email=$('email').value.trim(),pass=$('password').value;if(mode==='reset')run(()=>resetPassword(email));else if(mode==='register')run(()=>registerEmail($('name').value,email,pass));else run(()=>loginEmail(email,pass));};
$('google').onclick=()=>run(loginGoogle);
import {firebaseReady} from './firebase-config.js?v=20261110b';
if(!firebaseReady){$('message').textContent='Configurazione Firebase incompleta: apri firebase-config.js su GitHub e inserisci la vera apiKey Web del progetto livemarket-8f866. Finche non la inserisci, accesso, registrazione e recupero password non possono funzionare.'; $('message').classList.add('error');}
watchUser(u=>{if(u&&!busy&&mode!=='reset')location.href=destination;},e=>{$('message').textContent=friendlyError(e);});
</script></body></html>
