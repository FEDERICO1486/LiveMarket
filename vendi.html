<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendi un articolo | LiveMarket</title><link rel="stylesheet" href="style.css"></head><body><header><div class="bar"><a class="brand" href="index.html">LiveMarket</a><a href="index.html">Home</a><a href="index.html#articoli">Articoli</a><a href="index.html#dirette">🔴 LIVE</a></div></header><main style="max-width:1100px"><a class="back" href="index.html">← Torna al sito</a><section class="panel" id="vendi"><h2>Pubblica un articolo</h2><p class="muted" id="notice" role="status">Verifica account...</p><form id="sellForm" class="formgrid hidden"><label class="field">Nome articolo<input id="name" maxlength="100" required placeholder="Es. Giacca vintage"></label><label class="field">Prezzo (€)<input id="price" type="number" min="0.01" step="0.01" required placeholder="25.00"></label><label class="field">Categoria<select id="category" required><option>Abbigliamento</option><option>Elettronica</option><option>Videogiochi</option><option>Casa</option><option>Altro</option></select></label><label class="field">Nome venditore<input id="seller" maxlength="60" required></label><label class="field full">Descrizione<textarea id="description" maxlength="500" rows="3"></textarea></label><label class="field full">Foto prodotto (facoltativa, massimo 200 KB)<input id="photo" type="file" accept="image/png,image/jpeg,image/webp"><img class="preview" id="preview" alt="Anteprima"></label><div class="full"><button class="primary" id="submit" type="submit">Pubblica articolo</button> <span class="muted" id="message" role="status"></span></div></form></section></main><footer>© 2026 LiveMarket</footer><script type="module">
import {watchUser,db,friendlyError} from './auth.js';
import {collection,addDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const $=id=>document.getElementById(id);let user=null,photoData='';
watchUser(u=>{user=u;$('sellForm').classList.toggle('hidden',!u);if(u){$('notice').textContent='Account: '+(u.displayName||u.email);$('seller').value=u.displayName||u.email||'';}else{$('notice').replaceChildren(document.createTextNode('Per pubblicare devi prima '));const a=document.createElement('a');a.href='accesso.html?next=vendi';a.textContent='accedere o creare un account';$('notice').append(a,'.');}});
$('photo').onchange=()=>{photoData='';$('preview').style.display='none';const file=$('photo').files[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>200*1024){$('message').textContent='Usa JPG, PNG o WebP fino a 200 KB.';$('photo').value='';return;}const reader=new FileReader();reader.onload=()=>{photoData=String(reader.result);$('preview').src=photoData;$('preview').style.display='block';$('message').textContent='';};reader.readAsDataURL(file);};
$('sellForm').onsubmit=async e=>{e.preventDefault();if(!user)return;const name=$('name').value.trim(),seller=$('seller').value.trim(),price=Number($('price').value);if(!name||!seller||!Number.isFinite(price)||price<=0)return;const btn=$('submit');btn.disabled=true;$('message').textContent='Pubblicazione...';try{await addDoc(collection(db,'articoli'),{name,seller,price,category:$('category').value,description:$('description').value.trim(),photo:photoData,venditoreId:user.uid,createdAt:serverTimestamp()});location.href='index.html#articoli';}catch(err){$('message').textContent=friendlyError(err);btn.disabled=false;}};
</script></body></html>
