
<script type="module">
import { watchUser } from './auth.js';
import { firebaseConfig } from './firebase-config.js';

import { initializeApp, getApps, getApp }
  from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';

import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp
} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const db = getFirestore(app);
const $ = id => document.getElementById(id);

let user = null;

const notice = document.createElement('p');
notice.className = 'muted';
notice.setAttribute('role', 'status');
$('vendi').prepend(notice);

const form = $('sellForm');
const submitButton = form.querySelector('button[type="submit"]');
form.style.display = 'none';

watchUser(u => {
  user = u;

  if (!u) {
    notice.innerHTML =
      'Per vendere devi prima <a href="accesso.html?next=vendi">' +
      'accedere o creare un account</a>.';
    form.style.display = 'none';
    return;
  }

  notice.textContent =
    'Account: ' + (u.displayName || u.email || 'Utente') +
    '. I tuoi articoli saranno pubblicati online.';

  $('seller').value = u.displayName || u.email || '';
  form.style.display = 'grid';
});

$('photo').addEventListener('change', () => {
  const file = $('photo').files[0];
  $('preview').style.display = 'none';

  if (!file) return;

  if (!file.type.startsWith('image/') || file.size > 1024 * 1024) {
    alert('Scegli un’immagine di massimo 1 MB.');
    $('photo').value = '';
    return;
  }

  const reader = new FileReader();
  reader.onload = () => {
    $('preview').src = reader.result;
    $('preview').style.display = 'block';
  };
  reader.readAsDataURL(file);
});

form.addEventListener('submit', async e => {
  e.preventDefault();

  if (!user) {
    $('message').textContent = 'Devi effettuare l’accesso.';
    return;
  }

  const name = $('name').value.trim();
  const seller = $('seller').value.trim();
  const price = Number($('price').value);
  const description = $('description').value.trim();
  const category = $('sellCategory').value;

  if (!name || !seller || !Number.isFinite(price) || price <= 0) {
    $('message').textContent = 'Controlla i dati dell’articolo.';
    return;
  }

  if ($('photo').files.length) {
    $('message').textContent =
      'Per pubblicare una foto online dobbiamo ancora configurare Storage. ' +
      'Rimuovi la foto per pubblicare adesso.';
    return;
  }

  submitButton.disabled = true;
  $('message').textContent = 'Pubblicazione in corso...';

  try {
    await addDoc(collection(db, 'articoli'), {
      name,
      seller,
      price,
      category,
      description,
      venditoreId: user.uid,
      photo: '',
      createdAt: serverTimestamp()
    });

    $('message').textContent = 'Articolo pubblicato!';
    window.location.href = 'index.html#articoli';

  } catch (error) {
    console.error('Errore pubblicazione:', error);
    $('message').textContent =
      'Pubblicazione non riuscita: ' + error.message;
  } finally {
    submitButton.disabled = false;
  }
});
</script>
